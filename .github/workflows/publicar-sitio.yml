name: Publicar portal en la raíz

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publicar-sitio.yml"

permissions:
  contents: write

jobs:
  organizar-sitio:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Mover el portal a la raíz
        shell: bash
        run: |
          set -e
          origen="portal-academico-hrrg-github-pages"
          test -d "$origen"
          cp -a "$origen"/. .
          rm -rf "$origen"
          rm -f direccionacademicahrrg
          rm -f .github/workflows/publicar-sitio.yml

      - name: Guardar la estructura corregida
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publicar portal académico en la raíz"
          git push
